name: Claude Code Review
# PR 마다 Claude 가 먼저 리뷰한다(claude.dev "How the Claude Code team does code review", 2026-10-15).
# 공식 문서의 리뷰 workflow(code.claude.com/docs/en/github-actions "Run a skill")와 같은 code-review 플러그인을
# 쓴다. 지적은 PR 인라인 댓글(없으면 요약 댓글 하나)로만 남고 승인·차단은 하지 않는다. 기준은 CLAUDE.md 다.
# CLAUDE_CODE_OAUTH_TOKEN 비밀값이 없으면 건너뛴다. 구성·보안 조건은 docs/CI.md.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  # 지난 커밋의 리뷰는 쓸모없으므로 같은 PR 의 새 push 가 오면 버린다.
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # fork PR 과 draft 는 리뷰하지 않는다. fork PR 에는 비밀값도 주어지지 않는다(docs/CI.md "보안").
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: [self-hosted, Linux, X64, erp-dabi]
    timeout-minutes: 30
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: 비밀값 없음 — 리뷰 건너뜀
        if: env.HAS_CLAUDE_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN 비밀값이 없어 Claude 리뷰를 건너뛴다(docs/CI.md)."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      # 플러그인이 gh 로 PR 을 읽고 댓글을 단다. 러너 PC 에는 gh 가 없어 고정 판을 받아 러너 tool cache 에 둔다.
      - name: gh CLI 준비
        if: env.HAS_CLAUDE_TOKEN == 'true'
        run: |
          if command -v gh >/dev/null; then exit 0; fi
          ver=2.105.0
          sha=79e7ab5db738c48777b696e374f8b428f0647debfb424f44d2f426370407fe2f
          dir="$RUNNER_TOOL_CACHE/gh/$ver"
          if [[ ! -x "$dir/bin/gh" ]]; then
            tgz="$RUNNER_TEMP/gh.tar.gz"
            curl -fsSL -o "$tgz" "https://github.com/cli/cli/releases/download/v$ver/gh_${ver}_linux_amd64.tar.gz"
            echo "$sha  $tgz" | sha256sum -c --quiet
            mkdir -p "$dir"
            tar -xzf "$tgz" -C "$dir" --strip-components=1
          fi
          echo "$dir/bin" >> "$GITHUB_PATH"

      # github_token 은 이 job 의 권한(위 permissions)으로 묶이고 job 이 끝나면 만료된다. Claude GitHub App 은 필요 없다.
      - uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
