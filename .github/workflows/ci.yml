name: CI
# 검사: npm ci → npm test → npm run lint → npm run build. Node 24 이상(package.json pretest 가 확인).
# 러너: GitHub 사용량 문제로 사용자 CI PC(jena-dabi)의 이 저장소 전용 self-hosted 러너에서만 돈다.
# 공개 저장소라 fork PR 은 러너에 닿지 않게 막는다. 구성·러너·보안 조건은 docs/CI.md.

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR 은 새 push 가 오면 이전 검사를 버린다. main 은 커밋마다 결과를 남긴다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: test / lint / build
    # fork PR 은 job 을 만들지 않는다(같은 저장소 브랜치의 PR 만). fork 가 이 줄을 지운 workflow 를 보내도
    # 저장소 설정 "모든 외부 기여자 승인 필요" 때문에 승인 전에는 돌지 않는다(docs/CI.md "보안").
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, erp-dabi]
    timeout-minutes: 20
    steps:
      # action 은 SHA 로 고정한다. 뒤의 주석이 사람이 읽는 판이다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # npm 캐시는 러너 job 시작 hook 이 러너 디스크에 고정한다(npm_config_cache). GitHub 캐시는 쓰지 않는다.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
